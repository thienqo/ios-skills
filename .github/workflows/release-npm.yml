name: Release npm

on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm package
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check whether this version is already published
        id: version
        run: |
          set -euo pipefail
          name="$(jq -r '.name' package.json)"
          version="$(jq -r '.version' package.json)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install npm dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Validate release
        if: steps.version.outputs.publish == 'true'
        run: |
          python3 .github/scripts/validate_repository.py --release
          python3 -m unittest discover -s tests -v
          npm test
          npm run pack:check
          python3 .github/scripts/validate_public_discovery.py --run

      - name: Update npm for trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@^11.5.1

      - name: Publish to npm with provenance
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Tag the released commit
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION. See CHANGELOG.md." > release-notes.md
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file release-notes.md

      - name: Publish the Tessl plugin
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        # Tags pushed with GITHUB_TOKEN do not trigger other workflows, so dispatch it.
        run: gh workflow run publish-tessl-plugin.yml --ref "v$VERSION"
